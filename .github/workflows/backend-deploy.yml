name: Deploy Backend

on:
  push:
    branches: [ main, develop, feature/integration-back-frontend ]
    paths: [ "backendJava/**", ".github/workflows/backend-deploy.yml" ]

jobs:
  build-and-test:
    # ... (Job permanece inalterado)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: translator
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            nc -z localhost 5432 && echo "✅ PostgreSQL is ready!" && break
            echo "⏳ Attempt $i/30: PostgreSQL not ready yet..."
            sleep 2
          done
          if ! nc -z localhost 5432; then
            echo "❌ PostgreSQL failed to start!"
            exit 1
          fi
      - name: Run tests
        working-directory: ./backendJava
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/translator
          SPRING_DATASOURCE_USERNAME: app
          SPRING_DATASOURCE_PASSWORD: app
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LIBRE_BASE_URL: http://localhost:5000
        run: mvn test -X
      - name: Build with Maven
        working-directory: ./backendJava
        run: mvn clean package -DskipTests

  build-and-push:
    # ... (Job permanece inalterado)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backendJava
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tradutor-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tradutor-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/tradutor-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/tradutor-backend:buildcache,mode=max

  # =========================================================================
  # JOB DEPLOY CORRIGIDO E OTIMIZADO
  # =========================================================================
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3 # Apenas um checkout
        
      - name: Deploy and Sync Files
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          
          # COPIA O ARQUIVO DOCKER-COMPOSE.YML (Substitui Git Pull/Sed)
          source: "docker-compose.yml" 
          target: "/home/${{ secrets.EC2_USER }}/tradutor-documentos/"
          
          script: |
            set -e

            # ================================================
            # 1. SETUP DE DIRETÓRIOS E VARIÁVEIS DE AMBIENTE
            # ================================================
            TARGET_USER=${{ secrets.EC2_USER }}
            TARGET_DIR="/home/$TARGET_USER/tradutor-documentos"
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            
            # Cria o diretório (necessário para o 'target' do 'source' funcionar na 1ª vez)
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR
            
            # ================================================
            # 2. DEPLOY DOCKER
            # ================================================
            # Puxa a nova imagem (usa o :latest, já atualizado no push)
            docker pull $DOCKERHUB_USERNAME/tradutor-backend:latest
            
            # Reinicia os containers (o docker-compose.yml foi copiado via 'source')
            docker-compose -f docker-compose.yml down
            docker-compose -f docker-compose.yml up -d
            
            # ================================================
            # 3. VALIDAÇÃO
            # ================================================
            sleep 10
            # ESTE COMANDO AINDA PODE FALHAR COM 401 SE O SPRING SECURITY ESTIVER BLOQUEANDO
            curl -f http://localhost:8080/health || exit 1