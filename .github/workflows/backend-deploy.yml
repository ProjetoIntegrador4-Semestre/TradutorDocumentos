name: Deploy Backend

on:
  push:
    branches: [ main, develop, feature/integration-back-frontend ]
    paths: [ "backendJava/**", ".github/workflows/backend-deploy.yml" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: translator
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            nc -z localhost 5432 && echo "✅ PostgreSQL is ready!" && break
            echo "⏳ Attempt $i/30: PostgreSQL not ready yet..."
            sleep 2
          done
          if ! nc -z localhost 5432; then
            echo "❌ PostgreSQL failed to start!"
            exit 1
          fi
      - name: Run tests
        working-directory: ./backendJava
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/translator
          SPRING_DATASOURCE_USERNAME: app
          SPRING_DATASOURCE_PASSWORD: app
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LIBRE_BASE_URL: http://localhost:5000
        run: mvn test -X
      - name: Build with Maven
        working-directory: ./backendJava
        run: mvn clean package -DskipTests

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backendJava
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tradutor-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tradutor-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/tradutor-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/tradutor-backend:buildcache,mode=max

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3
      
      # =================================================
      # PREPARAR AMBIENTE EC2
      # =================================================
      - name: Prepare EC2 Environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Criar diretórios necessários
            mkdir -p /home/${{ secrets.EC2_USER }}/tradutor-documentos/data
            mkdir -p /home/${{ secrets.EC2_USER }}/tradutor-documentos/letsencrypt
            
            # Criar arquivo .env com todas as variáveis
            cat > /home/${{ secrets.EC2_USER }}/tradutor-documentos/.env << 'ENVEOF'
            # Docker Hub
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            
            # Database
            POSTGRES_USER=app
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            
            # PgAdmin
            PGADMIN_PASSWORD=${{ secrets.PGADMIN_PASSWORD }}
            
            # JWT
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            
            # Google OAuth2
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
            
            # App Config
            APP_BOOT_TOKEN=${{ secrets.APP_BOOT_TOKEN }}
            APP_OAUTH2_REDIRECT_URI=${{ secrets.APP_OAUTH2_REDIRECT_URI }}
            
            # Spring Profile
            SPRING_PROFILES_ACTIVE=prod
            ENVEOF
            
            echo "✅ Ambiente preparado"
        
      # =================================================
      # COPIAR DOCKER-COMPOSE.YML
      # =================================================
      - name: Copy Docker Compose File
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backendJava/docker-compose.yml"
          target: "/home/${{ secrets.EC2_USER }}/tradutor-documentos/"
          strip_components: 1
          
      # =================================================
      # DEPLOY DA APLICAÇÃO
      # =================================================
      - name: Deploy Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            TARGET_DIR="/home/${{ secrets.EC2_USER }}/tradutor-documentos"
            
            echo "================================================"
            echo "🚀 Iniciando Deploy do Backend"
            echo "================================================"
            
            cd $TARGET_DIR
            
            # Verificar arquivos
            echo ""
            echo "📋 Verificando arquivos necessários..."
            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ docker-compose.yml não encontrado!"
              exit 1
            fi
            
            if [ ! -f ".env" ]; then
              echo "❌ .env não encontrado!"
              exit 1
            fi
            
            echo "✅ Todos os arquivos encontrados"
            
            # Verificar Docker
            echo ""
            echo "🔍 Verificando Docker..."
            if ! command -v docker &> /dev/null; then
              echo "❌ Docker não instalado!"
              exit 1
            fi
            
            if ! command -v docker-compose &> /dev/null; then
              echo "❌ Docker Compose não instalado!"
              exit 1
            fi
            
            # Instalar lsof se não estiver disponível (para verificar portas)
            if ! command -v lsof &> /dev/null; then
              echo "📦 Instalando lsof..."
              sudo apt-get update -qq && sudo apt-get install -y lsof -qq 2>/dev/null || true
            fi
            
            echo "✅ Docker OK"
            
            # Puxar nova imagem
            echo ""
            echo "🔄 Puxando nova imagem do Docker Hub..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tradutor-backend:latest
            
            # Parar TODOS os containers do docker-compose
            echo ""
            echo "🛑 Parando containers do docker-compose..."
            docker-compose down -v 2>/dev/null || true
            
            # Encontrar e parar TODOS os containers que usam as portas necessárias
            echo ""
            echo "🔍 Verificando portas em uso..."
            
            # Parar containers que usam as portas
            for port in 8080 5432 5000 5050 81 443; do
              container_id=$(docker ps -q --filter "publish=$port")
              if [ ! -z "$container_id" ]; then
                echo "🛑 Parando container usando porta $port..."
                docker stop $container_id 2>/dev/null || true
                docker rm -f $container_id 2>/dev/null || true
              fi
            done
            
            # Remover containers específicos por nome (caso existam)
            echo ""
            echo "🧹 Removendo containers por nome..."
            docker rm -f translator-db libretranslate nginx-proxy-manager translator-pgadmin backend-java 2>/dev/null || true
            
            # Verificar se ainda há algo usando as portas (processos do sistema)
            echo ""
            echo "🔍 Verificando processos do sistema nas portas..."
            for port in 8080 5432 5000 5050 81 443; do
              pid=$(lsof -ti:$port 2>/dev/null || true)
              if [ ! -z "$pid" ]; then
                echo "⚠️  Aviso: Processo $pid ainda usando porta $port (não é um container Docker)"
              fi
            done
            
            # Limpar recursos não utilizados
            echo ""
            echo "🧹 Limpando recursos Docker..."
            docker system prune -af --volumes 2>/dev/null || true
            
            # Aguardar um pouco para garantir que as portas foram liberadas
            echo ""
            echo "⏳ Aguardando liberação de portas..."
            sleep 5
            
            # Iniciar todos os serviços
            echo ""
            echo "🚀 Iniciando serviços..."
            docker-compose up -d
            
            # Aguardar inicialização
            echo ""
            echo "⏳ Aguardando serviços inicializarem..."
            echo "   - PostgreSQL: ~10s"
            echo "   - LibreTranslate: ~15s"
            echo "   - Backend: ~60s"
            sleep 60
            
            # Verificar status dos containers
            echo ""
            echo "📊 Status dos containers:"
            docker-compose ps
            
            # Health check do backend
            echo ""
            echo "🔍 Verificando health check do backend..."
            BACKEND_HEALTHY=false
            
            for i in {1..15}; do
              # Tentar endpoint do actuator
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health 2>/dev/null)
              if [ "$RESPONSE" = "200" ]; then
                echo "✅ Backend respondeu no /actuator/health"
                BACKEND_HEALTHY=true
                break
              fi
              
              # Tentar endpoint /health
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health 2>/dev/null)
              if [ "$RESPONSE" = "200" ]; then
                echo "✅ Backend respondeu no /health"
                BACKEND_HEALTHY=true
                break
              fi
              
              # Tentar raiz da aplicação
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ 2>/dev/null)
              if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "404" ] || [ "$RESPONSE" = "403" ]; then
                echo "✅ Backend está respondendo (HTTP $RESPONSE)"
                BACKEND_HEALTHY=true
                break
              fi
              
              echo "⏳ Tentativa $i/15: Aguardando backend responder... (HTTP $RESPONSE)"
              sleep 5
            done
            
            if [ "$BACKEND_HEALTHY" = true ]; then
                echo ""
                echo "================================================"
                echo "✅ DEPLOY CONCLUÍDO COM SUCESSO!"
                echo "================================================"
                echo ""
                echo "🌐 Serviços disponíveis:"
                echo "   - Backend API: http://localhost:8080"
                echo "   - Actuator: http://localhost:8080/actuator"
                echo "   - PostgreSQL: localhost:5432"
                echo "   - PgAdmin: http://localhost:5050"
                echo "   - LibreTranslate: http://localhost:5000"
                echo "   - Nginx Proxy Manager: http://localhost:81"
                echo ""
                exit 0
            fi
            
            # Se chegou aqui, o health check falhou
            echo ""
            echo "❌ Health check do backend falhou!"
            echo ""
            echo "📋 Logs do Backend (últimas 100 linhas):"
            docker-compose logs --tail=100 backend
            echo ""
            echo "📋 Logs do PostgreSQL (últimas 50 linhas):"
            docker-compose logs --tail=50 db
            echo ""
            echo "📋 Logs do LibreTranslate (últimas 30 linhas):"
            docker-compose logs --tail=30 libretranslate
            exit 1
      
      # =================================================
      # NOTIFICAÇÃO DE SUCESSO
      # =================================================
      - name: Deployment Success Notification
        if: success()
        run: |
          echo "================================================"
          echo "✅ DEPLOY REALIZADO COM SUCESSO!"
          echo "================================================"
          echo ""
          echo "🌐 Acesse seus serviços:"
          echo "   Backend API: http://${{ secrets.EC2_HOST }}:8080"
          echo "   PgAdmin: http://${{ secrets.EC2_HOST }}:5050"
          echo "   Nginx Proxy Manager: http://${{ secrets.EC2_HOST }}:81"
          echo ""
          echo "📝 Próximos passos:"
          echo "   1. Configure o Nginx Proxy Manager"
          echo "   2. Configure SSL com Let's Encrypt"
          echo "   3. Teste as rotas da API"