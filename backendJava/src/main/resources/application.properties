# ============================
# SERVER
# ============================
server.port=${SERVER_PORT:8080}

# ============================
# BANCO DE DADOS - POSTGRESQL
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/translator}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# JPA / HIBERNATE
# ============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# ============================
# ERROS
# ============================
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}

# ============================
# SWAGGER
# ============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================
# JWT
# ============================
jwt.secret=${JWT_SECRET}
jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:60}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ============================
# LIBREOFFICE
# ============================
libre.base-url=${LIBRE_BASE_URL:http://localhost:5000}

# ============================
# GOOGLE OAUTH2
# ============================
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE:openid,profile,email}
spring.security.oauth2.client.registration.google.redirect-uri=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI:https://tradudoc.duckdns.org/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.client-name=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_NAME:Google}

# ============================
# CONFIGURAÇÕES DE RESET/OAUTH
# ============================
app.reset.expMinutes=${APP_RESET_EXPMINUTES:30}
app.frontend.reset-path=${APP_FRONTEND_RESET_PATH:/reset-password}
app.oauth2.redirect-uri=${APP_OAUTH2_REDIRECT_URI}

# ============================
# LOGGING
# ============================
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}