# 1. Configura o DataSource para usar o H2 em memória
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Desativa o Flyway (Mais seguro para testes unitários/integração)
spring.flyway.enabled=false

# 3. Garante que o JPA use o dialeto H2 (para não tentar usar o PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Opcional: Mostra menos log no console de teste
logging.level.root=WARN
logging.level.org.springframework=WARN