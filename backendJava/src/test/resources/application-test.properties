# ============================
# CONFIGURAÇÃO PARA TESTES (CI/CD)
# ============================

# Porta da API
server.port=8080

# ============================
# CONFIGURAÇÃO DE ARMAZENAMENTO (LOCAL STORAGE)
# ============================
# Define um diretório temporário para testes
app.storage.upload-dir=target/temp-uploads
app.storage.output-dir=target/temp-output

# ============================
# BANCO DE DADOS - POSTGRESQL
# ============================
# No CI, o banco roda em localhost:5432 (não em "db:5432" como no Docker Compose)
# As variáveis de ambiente sobrescrevem estes valores no CI
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/translator}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do pool de conexões para testes
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================
# JPA / HIBERNATE
# ============================
# Para testes, usa create-drop para limpar o banco a cada execução
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================
# FLYWAY (SE VOCÊ USAR)
# ============================
# Desabilita Flyway em testes, pois o Hibernate já cria o schema
spring.flyway.enabled=false

# ============================
# ERROS
# ============================
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.forward-headers-strategy=native

# ============================
# SWAGGER
# ============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================
# JWT
# ============================
jwt.secret=${JWT_SECRET:IntrMvLCt0wNl8AhgqtP017Y5vkvh4WgfLfsULHhN2MFAhjWcbKD5BXikOF7mf85UI}
jwt.access-token-minutes=60
jwt.expiration=3600000

# ============================
# LIBREOFFICE
# ============================
libre.base-url=${LIBRE_BASE_URL:http://localhost:5000}

# ============================
# GOOGLE OAUTH2 - Valores de teste
# ============================
# No CI, usa as variáveis de ambiente dos secrets
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:test-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google

# ============================
# CONFIGURAÇÕES DE RESET/OAUTH
# ============================
app.reset.expMinutes=30
app.frontend.reset-path=/reset-password
app.oauth2.redirect-uri=http://localhost:3000/oauth/callback

# ============================
# LOGGING
# ============================
# Reduz logs em testes, mas mantém erros visíveis
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
# Ativa logs de SQL apenas se precisar debugar
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE